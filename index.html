<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Phân Tích Cảm Xúc Khách Hàng</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:30px;
width:500px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
text-align:center;
}

textarea{
width:100%;
height:120px;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

button{
margin-top:15px;
padding:12px 25px;
border:none;
background:#007bff;
color:white;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.result{
margin-top:20px;
font-size:20px;
font-weight:bold;
}

.positive{
color:green;
}

.negative{
color:red;
}

.neutral{
color:orange;
}

</style>

</head>

<body>

<div class="container">

<h2>AI Phân Tích Cảm Xúc Khách Hàng</h2>

<p>Nhập phản hồi khách hàng:</p>

<textarea id="textInput" placeholder="Ví dụ: Sản phẩm rất tốt tôi rất hài lòng"></textarea>

<button onclick="analyze()">Phân tích cảm xúc</button>

<div class="result" id="result"></div>

</div>

<script>

const API_KEY = "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";

async function analyze(){

const text=document.getElementById("textInput").value;

if(text===""){
alert("Vui lòng nhập phản hồi");
return;
}

document.getElementById("result").innerHTML="⏳ AI đang phân tích...";

try{

const response=await fetch(
"https://api-inference.huggingface.co/models/cardiffnlp/twitter-xlm-roberta-base-sentiment",
{
method:"POST",
headers:{
"Authorization":"Bearer "+API_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
inputs:text
})
}
);

const data=await response.json();

console.log(data);

let label=data[0][0].label;
let score=data[0][0].score;

let resultText="";
let className="";

if(label.includes("positive")){
resultText="😊 Tích cực ("+(score*100).toFixed(1)+"%)";
className="positive";
}

else if(label.includes("negative")){
resultText="😡 Tiêu cực ("+(score*100).toFixed(1)+"%)";
className="negative";
}

else{
resultText="😐 Trung lập ("+(score*100).toFixed(1)+"%)";
className="neutral";
}

const resultDiv=document.getElementById("result");

resultDiv.innerText=resultText;
resultDiv.className="result "+className;

}

catch(error){

console.error(error);

document.getElementById("result").innerHTML="😳 Không phân tích được";

}

}

</script>

</body>
</html>
