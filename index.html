<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Sentiment Analysis</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:500px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
text-align:center;
}

textarea{
width:100%;
height:120px;
padding:10px;
margin-top:10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
margin-top:15px;
padding:10px 20px;
border:none;
background:#007bff;
color:white;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.result{
margin-top:20px;
font-weight:bold;
font-size:18px;
}

.positive{
color:green;
}

.negative{
color:red;
}

.neutral{
color:orange;
}

</style>

</head>

<body>

<div class="container">

<h2>AI Phân Tích Cảm Xúc Khách Hàng</h2>

<p>Nhập phản hồi khách hàng:</p>

<textarea id="textInput" placeholder="Ví dụ: Sản phẩm rất tốt tôi rất hài lòng"></textarea>

<button onclick="analyze()">Phân tích cảm xúc</button>

<div class="result" id="result"></div>

</div>

<script>

const API_KEY = "AIzaSyAojNeQs-zG5oby3Xjnu6-T_nWQXOxWFt0";

async function analyze(){

const text=document.getElementById("textInput").value;

if(text===""){
alert("Vui lòng nhập phản hồi");
return;
}

const response=await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key="+API_KEY,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:`Bạn là AI phân tích cảm xúc phản hồi khách hàng.

Hãy đọc đoạn văn sau và xác định cảm xúc của khách hàng.

Chỉ trả lời một trong ba kết quả sau:
Tích cực
Tiêu cực
Trung lập

Đoạn văn: ${text}`
}
]
}
]
})
}
);

const data=await response.json();

let result=data.candidates[0].content.parts[0].text;

const resultDiv=document.getElementById("result");

resultDiv.innerText=result;

resultDiv.className="result";

if(result.includes("Tích cực"))
resultDiv.classList.add("positive");

else if(result.includes("Tiêu cực"))
resultDiv.classList.add("negative");

else
resultDiv.classList.add("neutral");

}

</script>

</body>
</html>
