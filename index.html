<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Phân tích phản hồi khách hàng</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#36a2d6,#2ec4b6);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.container{
background:white;
padding:30px;
width:600px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:20px;
}

textarea{
width:100%;
height:120px;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
background:#2f3640;
color:white;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1e272e;
}

.result{
margin-top:20px;
padding:15px;
border-radius:8px;
background:#f1f2f6;
}

.insight{
background:#e8f4ff;
border-left:4px solid #3498db;
padding:15px;
margin-top:15px;
border-radius:6px;
}

</style>
</head>

<body>

<div class="container">

<h2>🤖 AI Phân tích cảm xúc khách hàng</h2>

<textarea id="textInput" placeholder="Nhập phản hồi khách hàng..."></textarea>

<button onclick="analyze()">Phân tích bằng AI</button>

<div class="result" id="result"></div>

</div>

<script>

function analyze(){

let text=document.getElementById("textInput").value.toLowerCase();
let result=document.getElementById("result");

if(text.trim()===""){
alert("Vui lòng nhập phản hồi khách hàng");
return;
}

/* từ khóa */

let positive=[
"tốt","tuyệt","hài lòng","ưng","ok","đẹp","nhanh","chất lượng","thích",
"ổn","rất tốt","quá tốt","tuyệt vời","xuất sắc","hoàn hảo"
];

let negative=[
"kém","tệ","chậm","bực","thất vọng","xấu","dở","lâu","tệ hại",
"không tốt","không ổn","rất chậm","quá lâu","không hài lòng"
];

/* tính điểm cảm xúc */

let score=0;

positive.forEach(w=>{
if(text.includes(w)) score++;
});

negative.forEach(w=>{
if(text.includes(w)) score--;
});

/* xác định cảm xúc */

let sentiment="Trung lập 😐";

if(score>1) sentiment="Tích cực 😊";
if(score< -1) sentiment="Tiêu cực 😡";
if(score===1 || score===-1) sentiment="Vừa hài lòng vừa chưa hài lòng 🙂";

/* nhận diện chủ đề */

let topics=[];

if(text.includes("giao")) topics.push("Giao hàng");
if(text.includes("ship")) topics.push("Giao hàng");

if(text.includes("sản phẩm") || text.includes("chất lượng"))
topics.push("Chất lượng sản phẩm");

if(text.includes("giá") || text.includes("đắt") || text.includes("rẻ"))
topics.push("Giá cả");

if(text.includes("dịch vụ") || text.includes("nhân viên"))
topics.push("Dịch vụ khách hàng");

if(text.includes("đóng gói") || text.includes("bao bì"))
topics.push("Đóng gói");

if(topics.length===0) topics.push("Phản hồi chung");

/* phản hồi CSKH đa dạng */

let positiveReplies=[

"Cảm ơn bạn đã phản hồi tích cực. Chúng tôi rất vui khi sản phẩm mang lại trải nghiệm tốt cho bạn.",
"Chúng tôi rất cảm kích khi nhận được phản hồi hài lòng từ bạn. Hy vọng tiếp tục được phục vụ bạn.",
"Rất vui khi bạn có trải nghiệm tốt với sản phẩm. Cảm ơn bạn đã ủng hộ chúng tôi."

];

let negativeReplies=[

"Chúng tôi xin lỗi vì trải nghiệm của bạn chưa được như mong đợi. Chúng tôi sẽ kiểm tra và cải thiện ngay.",
"Cảm ơn bạn đã góp ý. Chúng tôi rất tiếc vì sự bất tiện và sẽ cải thiện dịch vụ trong thời gian tới.",
"Chúng tôi xin lỗi về trải nghiệm chưa tốt và sẽ cố gắng khắc phục để phục vụ bạn tốt hơn."

];

let mixedReplies=[

"Cảm ơn bạn đã chia sẻ phản hồi. Chúng tôi rất vui khi bạn hài lòng ở một số điểm và sẽ cải thiện những điểm chưa tốt.",
"Chúng tôi trân trọng góp ý của bạn. Chúng tôi sẽ giữ vững những điểm tốt và khắc phục những điểm chưa hoàn thiện.",
"Cảm ơn bạn đã phản hồi chi tiết. Điều này giúp chúng tôi nâng cao chất lượng dịch vụ."

];

let neutralReplies=[

"Cảm ơn bạn đã chia sẻ ý kiến. Phản hồi của bạn giúp chúng tôi cải thiện dịch vụ.",
"Chúng tôi ghi nhận phản hồi của bạn và sẽ tiếp tục hoàn thiện sản phẩm.",
"Cảm ơn bạn đã dành thời gian góp ý cho chúng tôi."

];

/* chọn phản hồi random */

function random(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

let reply="";

if(sentiment.includes("Tích cực")){
reply=random(positiveReplies);
}

else if(sentiment.includes("Tiêu cực")){
reply=random(negativeReplies);
}

else if(sentiment.includes("Vừa")){
reply=random(mixedReplies);
}

else{
reply=random(neutralReplies);
}

/* hiển thị */

result.innerHTML=`

<h3>📊 Kết quả phân tích AI</h3>

<div class="insight">

<b>Cảm xúc khách hàng:</b> ${sentiment}

<br><br>

<b>Chủ đề phản hồi:</b> ${topics.join(", ")}

<br><br>

<b>Phản hồi CSKH:</b><br><br>

${reply}

</div>

`;

}

</script>

</body>
</html>
