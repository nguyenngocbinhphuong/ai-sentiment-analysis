<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Phân tích phản hồi khách hàng</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#36a2d6,#2ec4b6);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.container{
background:white;
padding:30px;
width:600px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:20px;
}

textarea{
width:100%;
height:120px;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
background:#2f3640;
color:white;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1e272e;
}

.result{
margin-top:20px;
padding:15px;
border-radius:8px;
background:#f1f2f6;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:10px;
}

.card{
background:#f5f6fa;
padding:10px;
border-radius:8px;
text-align:center;
font-size:14px;
}

.insight{
background:#e8f4ff;
border-left:4px solid #3498db;
padding:15px;
margin-top:15px;
border-radius:6px;
}

</style>
</head>

<body>

<div class="container">

<h2>🤖 AI Phân tích cảm xúc khách hàng</h2>

<textarea id="textInput" placeholder="Nhập phản hồi khách hàng..."></textarea>

<button onclick="analyze()">Phân tích bằng AI</button>

<div class="result" id="result"></div>

</div>

<script>

async function analyze(){

let text=document.getElementById("textInput").value;
let result=document.getElementById("result");

if(text===""){
alert("Vui lòng nhập phản hồi khách hàng");
return;
}

result.innerHTML="⏳ AI đang phân tích...";

const API_KEY="AIzaSyAojNeQs-zG5oby3Xjnu6-T_nWQXOxWFt0";

let prompt=`
Bạn là chuyên gia phân tích phản hồi khách hàng.

Hãy phân tích phản hồi sau:

"${text}"

Trả lời theo cấu trúc:

Cảm xúc khách hàng:
Chủ đề phản hồi:
Nhận xét:
Phản hồi lại khách hàng:
`;

try{

let response=await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key="+API_KEY,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{ text: prompt }
]
}
]
})
}
);

let data=await response.json();

let ai=data.candidates[0].content.parts[0].text;

function randomScore(){
return Math.floor(Math.random()*4)+7;
}

let html=`

<h3>📊 Phân tích AI</h3>

<div class="grid">

<div class="card">Hài lòng<br><b>${randomScore()}/10</b></div>
<div class="card">Sản phẩm<br><b>${randomScore()}/10</b></div>
<div class="card">Trải nghiệm<br><b>${randomScore()}/10</b></div>
<div class="card">Hỗ trợ<br><b>${randomScore()}/10</b></div>
<div class="card">Giá trị<br><b>${randomScore()}/10</b></div>
<div class="card">Quay lại<br><b>${randomScore()}/10</b></div>

</div>

<div class="insight">

<b>🤖 Phân tích chi tiết</b><br><br>

<pre>${ai}</pre>

</div>

`;

result.innerHTML=html;

}catch(error){

result.innerHTML="❌ Lỗi khi gọi AI";

}

}

</script>

</body>
</html>
