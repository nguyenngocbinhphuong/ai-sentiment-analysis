<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Phân tích phản hồi khách hàng</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#36a2d6,#2ec4b6);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.container{
background:white;
padding:30px;
width:850px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

textarea{
width:100%;
height:120px;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
background:#2f3640;
color:white;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.result{
margin-top:20px;
padding:20px;
background:#f1f2f6;
border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<h2>🤖 AI Phân tích phản hồi khách hàng</h2>

<textarea id="textInput" placeholder="Nhập phản hồi khách hàng"></textarea>

<button onclick="analyze()">Phân tích AI</button>

<div class="result" id="result"></div>

<h3>📊 Thống kê cảm xúc</h3>

<canvas id="chart"></canvas>

</div>

<script>

const API_KEY="AIzaSyAojNeQs-zG5oby3Xjnu6-T_nWQXOxWFt0";

let positive=0;
let negative=0;
let neutral=0;

let chart=new Chart(
document.getElementById("chart"),
{
type:"bar",
data:{
labels:["Tích cực","Tiêu cực","Trung lập"],
datasets:[{
label:"Phản hồi khách hàng",
data:[0,0,0]
}]
}
});

let response = await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY,
{
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
contents: [{
parts: [{
text: prompt
}]
}]
})
}
);

let data = await response.json();

let result = data.candidates[0].content.parts[0].text;

document.getElementById("result").innerText = result;

if(!data.candidates){
throw new Error("AI không trả kết quả");
}

let ai = data.candidates[0].content.parts[0].text;

let data=await response.json();

let ai=data.candidates[0].content.parts[0].text;

result.innerHTML="<pre>"+ai+"</pre>";

if(ai.includes("Tích cực")) positive++;
else if(ai.includes("Tiêu cực")) negative++;
else neutral++;

chart.data.datasets[0].data=[positive,negative,neutral];

chart.update();

}catch{

result.innerHTML="❌ Không kết nối được AI";

}

}

</script>

</body>
</html>
