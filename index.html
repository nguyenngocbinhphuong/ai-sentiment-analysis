<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Phân Tích Cảm Xúc Khách Hàng</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:500px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
text-align:center;
}

textarea{
width:100%;
height:120px;
padding:10px;
border-radius:5px;
border:1px solid #ccc;
font-size:16px;
}

button{
margin-top:15px;
padding:10px 20px;
border:none;
background:#007bff;
color:white;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.result{
margin-top:20px;
font-size:20px;
font-weight:bold;
}

.positive{color:green;}
.negative{color:red;}
.neutral{color:orange;}

</style>
</head>

<body>

<div class="container">

<h2>AI Phân Tích Cảm Xúc Khách Hàng</h2>

<p>Nhập phản hồi khách hàng:</p>

<textarea id="textInput"></textarea>

<button onclick="analyze()">Phân tích cảm xúc</button>

<div class="result" id="result"></div>

</div>

<script>

function analyze(){

let text=document.getElementById("textInput").value.toLowerCase();

if(text===""){
alert("Vui lòng nhập phản hồi");
return;
}

let positiveWords=[
"tốt","tuyệt","hài lòng","ưng","ok","ngon",
"đẹp","nhanh","chất lượng","tuyệt vời",
"thích","xuất sắc","ổn","đỉnh"
];

let negativeWords=[
"tệ","kém","chậm","không tốt","bực",
"thất vọng","xấu","dở","tệ hại",
"không hài lòng","lỗi","hỏng"
];

let score=0;

positiveWords.forEach(word=>{
if(text.includes(word)) score++;
});

negativeWords.forEach(word=>{
if(text.includes(word)) score--;
});

let resultDiv=document.getElementById("result");

if(score>0){

resultDiv.innerHTML="😊 Tích cực";
resultDiv.className="result positive";

}

else if(score<0){

resultDiv.innerHTML="😡 Tiêu cực";
resultDiv.className="result negative";

}

else{

resultDiv.innerHTML="😐 Trung lập";
resultDiv.className="result neutral";

}

}

</script>

</body>
</html>
