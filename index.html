<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Phân tích phản hồi khách hàng</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#36a2d6,#2ec4b6);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.container{
background:white;
padding:30px;
width:600px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:20px;
}

textarea{
width:100%;
height:120px;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:16px;
}

button{
margin-top:15px;
width:100%;
padding:12px;
border:none;
background:#2f3640;
color:white;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1e272e;
}

.result{
margin-top:20px;
padding:15px;
border-radius:8px;
background:#f1f2f6;
}

.insight{
background:#e8f4ff;
border-left:4px solid #3498db;
padding:15px;
margin-top:15px;
border-radius:6px;
}

</style>
</head>

<body>

<div class="container">

<h2>🤖 AI Phân tích cảm xúc khách hàng</h2>

<textarea id="textInput" placeholder="Nhập phản hồi khách hàng..."></textarea>

<button onclick="analyze()">Phân tích bằng AI</button>

<div class="result" id="result"></div>

</div>

<script>

function analyze(){

let text=document.getElementById("textInput").value.toLowerCase();
let result=document.getElementById("result");

if(text===""){
alert("Vui lòng nhập phản hồi khách hàng");
return;
}

let positiveWords=[
"tốt","tuyệt","hài lòng","ưng","ok","đẹp","nhanh","chất lượng","thích","ổn"
];

let negativeWords=[
"tệ","kém","chậm","bực","thất vọng","xấu","dở","lâu","tệ hại"
];

let score=0;

positiveWords.forEach(word=>{
if(text.includes(word)) score++;
});

negativeWords.forEach(word=>{
if(text.includes(word)) score--;
});

let sentiment="Trung lập 😐";

if(score>0) sentiment="Tích cực 😊";
if(score<0) sentiment="Tiêu cực 😡";

/* phân tích chủ đề */

let topic="Chung";

if(text.includes("giao")) topic="Giao hàng";
if(text.includes("sản phẩm")) topic="Chất lượng sản phẩm";
if(text.includes("giá")) topic="Giá cả";
if(text.includes("dịch vụ")) topic="Dịch vụ";

/* phản hồi */

let reply="";

if(sentiment.includes("Tích cực")){

reply="Cảm ơn bạn đã phản hồi tích cực. Chúng tôi rất vui khi bạn hài lòng với sản phẩm và dịch vụ.";

}

else if(sentiment.includes("Tiêu cực")){

reply="Chúng tôi xin lỗi vì trải nghiệm chưa tốt. Chúng tôi sẽ kiểm tra và cải thiện dịch vụ trong thời gian tới.";

}

else{

reply="Cảm ơn bạn đã chia sẻ phản hồi. Chúng tôi sẽ tiếp tục cải thiện sản phẩm và dịch vụ.";

}

result.innerHTML=`

<h3>📊 Kết quả phân tích AI</h3>

<div class="insight">

<b>Cảm xúc khách hàng:</b> ${sentiment}

<br><br>

<b>Chủ đề phản hồi:</b> ${topic}

<br><br>

<b>Phản hồi CSKH:</b><br>
${reply}

</div>

`;

}

</script>

</body>
</html>
